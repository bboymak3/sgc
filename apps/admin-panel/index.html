<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGC Admin - Sistema de Gestión de Citas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-calendar-check"></i>
      </div>
      <h1>SGC Admin</h1>
      <p class="login-subtitle">Sistema de Gestión de Citas</p>
      <form id="login-form">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" id="login-username" class="form-control" placeholder="Usuario" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" id="login-password" class="form-control" placeholder="Contraseña" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="login-btn">
          <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
        <div id="login-error" class="login-error" style="display:none;"></div>
      </form>
      <p class="login-hint">Usuario por defecto: <code>admin</code> / <code>admin123</code></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app-screen" style="display:none;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark sgc-navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <i class="fas fa-calendar-check"></i>
          <strong>SGC Admin</strong>
          <small>Sistema de Gestión de Citas</small>
        </a>
        <div class="d-flex align-items-center">
          <span class="text-light me-3" id="user-info"></span>
          <button class="btn btn-sm btn-outline-light" id="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Salir
          </button>
        </div>
      </div>
    </nav>

    <div class="d-flex">
      <!-- Sidebar -->
      <nav class="sgc-sidebar" id="sidebar">
        <a href="#" class="sgc-nav-item active" data-view="dashboard">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
        <a href="#" class="sgc-nav-item" data-view="citas">
          <i class="fas fa-calendar"></i> Citas
        </a>
        <a href="#" class="sgc-nav-item" data-view="ordenes">
          <i class="fas fa-clipboard-list"></i> Órdenes
        </a>
        <a href="#" class="sgc-nav-item" data-view="tecnicos">
          <i class="fas fa-user-cog"></i> Técnicos
        </a>
      </nav>

      <!-- Main content -->
      <main class="sgc-main">
        <div id="view-dashboard" class="sgc-view"></div>
        <div id="view-citas" class="sgc-view" style="display:none;"></div>
        <div id="view-ordenes" class="sgc-view" style="display:none;"></div>
        <div id="view-tecnicos" class="sgc-view" style="display:none;"></div>
      </main>
    </div>
  </div>

  <!-- Modal genérico -->
  <div class="modal fade" id="sgc-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="sgc-modal-title">Título</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="sgc-modal-body"></div>
        <div class="modal-footer" id="sgc-modal-footer"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="sgc-toast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto" id="toast-title">SGC</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/citas.js"></script>
  <script src="/js/ordenes.js"></script>
  <script src="/js/tecnicos.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
